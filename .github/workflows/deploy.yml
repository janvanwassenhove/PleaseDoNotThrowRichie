name: Deploy to GitHub Pages

# Pushes to main publish the current tip. release.yml then dispatches this workflow
# on main with the tag it just cut as `ref`, so the live site's version badge matches
# the newest release rather than the commit before the version bump. The dispatch has
# to run on main: the github-pages environment only admits the default branch, so a
# run on the tag itself is refused at the deploy job. (A `release: published` trigger
# would not do either: GitHub raises no events for releases that GITHUB_TOKEN creates.)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build and publish (default: the ref the run is on)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
