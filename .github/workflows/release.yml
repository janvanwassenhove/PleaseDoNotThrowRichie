name: Release

# Every push to main cuts a patch release: the workflow captures gameplay screenshots
# and packages the built static site from the pushed commit (each job bumps its own
# checkout so the version badge already reads the release it is becoming), and only
# then bumps package.json for real, tags it and publishes a GitHub Release with an
# auto-generated changelog. Nothing is tagged unless everything before it succeeded.
#
# Use the manual "Run workflow" button for a minor/major bump instead.
#
# Loop safety: the version-bump commit is pushed with the default GITHUB_TOKEN, and
# GitHub deliberately does NOT trigger workflows from GITHUB_TOKEN pushes, so it
# cannot re-trigger this workflow. The commit also carries [skip ci] and the
# `chore(release):` guard below, in case a PAT is ever wired up here.
#
# The last job dispatches deploy.yml on main with the new tag as its `ref` input, so
# the live site on GitHub Pages carries the version this run just cut. (GitHub raises
# no events for the release or the tag, because GITHUB_TOKEN created them, so it has
# to be explicit; and the github-pages environment admits only main, so the run
# itself cannot be on the tag.)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write
  actions: write # to dispatch deploy.yml at the new tag

concurrency:
  group: release-main
  cancel-in-progress: false # never abandon a half-published release

jobs:
  # ------------------------------------------ test, and work out the next version
  prepare:
    name: Test & pick the version
    runs-on: ubuntu-latest
    # Skip the bump commit itself, and let a human opt out with [skip release].
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!startsWith(github.event.head_commit.message, 'chore(release):') &&
       !contains(github.event.head_commit.message, '[skip release]'))
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      level: ${{ steps.next.outputs.level }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm test

      - name: Work out the next version
        id: next
        run: |
          set -euo pipefail
          LEVEL='${{ github.event.inputs.bump || 'patch' }}'
          # A dry bump: package.json in this checkout only, nothing committed or pushed.
          # tail -n1 guards against npm printing notices before the version line.
          TAG="$(npm version "$LEVEL" --no-git-tag-version | tail -n1)"
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------- screenshots
  screenshots:
    name: Capture screenshots
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm version '${{ needs.prepare.outputs.level }}' --no-git-tag-version # the badge shows the release it is becoming
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots
      # A hand-off to the publish job in the same run; the shots end up in the notes.
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 1

  # --------------------------------------------------------- the playable build
  # The game is a static site, so the release asset is the built site itself: one
  # zip anyone can drop on a web server, and the exact bytes behind the tag.
  site:
    name: Package the static site
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm version '${{ needs.prepare.outputs.level }}' --no-git-tag-version
      - run: npm run build
      - name: Zip it
        run: |
          set -euo pipefail
          mkdir -p out
          (cd dist && zip -qr "../out/PleaseDoNotThrowRichie-${{ needs.prepare.outputs.version }}-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------ release notes
  publish:
    name: Bump, tag, compose notes & publish
    needs: [prepare, screenshots, site]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can diff against the last tag
      - uses: actions/setup-node@v4
        with: {node-version: 24}

      # Everything that could fail has succeeded: now the version bump is for real.
      # The push is a fast-forward of main from the pushed commit; if main moved in the
      # meantime it is refused and the release simply has to run again.
      - name: Bump, commit and tag
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TAG="$(npm version '${{ needs.prepare.outputs.level }}' -m 'chore(release): %s [skip ci]' | tail -n1)"
          [ "$TAG" = '${{ needs.prepare.outputs.tag }}' ] || { echo "version drifted: $TAG vs ${{ needs.prepare.outputs.tag }}"; exit 1; }
          git push --follow-tags origin HEAD:main

      # Pull every artifact (screenshots + the zipped site) into ./artifacts/*.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compose release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DL="https://github.com/$REPO/releases/download/$TAG"
          ZIP="PleaseDoNotThrowRichie-$VERSION-web.zip"

          # Commits since the previous *published* release (or the whole history for the
          # first one). Not the previous tag: a run that tagged and then failed leaves a tag
          # with no release behind, and that must not swallow its commits from the notes.
          PREV="$(gh release view --json tagName -q .tagName 2>/dev/null || echo '')"
          if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi

          {
            echo "**Please Do Not Throw Richie $TAG** — an irresponsible Devoxx physics game."
            echo "Richie has a keynote. Richie has no legs. Get him from registration to the keynote"
            echo "stage on hops alone, with help from Voxxy, Droid, Biggy and an audience that should"
            echo "know better."
            echo
            echo "▶ **Play in your browser:** https://janvanwassenhove.github.io/PleaseDoNotThrowRichie/"
            echo
            echo "## Download"
            echo
            echo "| What | File |"
            echo "| --- | --- |"
            echo "| The playable build, as a static site | [\`$ZIP\`]($DL/$ZIP) |"
            echo
            echo "Unzip it and serve the folder over HTTP — it is plain static files with no backend,"
            echo "and it works from a subpath. Opening \`index.html\` straight off disk does not work:"
            echo "ES modules and the physics WebAssembly need an HTTP origin."
            echo
            echo "## Screenshots"
            echo
            echo "| The pitch | The problem |"
            echo "| --- | --- |"
            echo "| ![Title]($DL/01-title.png) | ![Opening]($DL/02-opening.png) |"
            echo "| ![Exhibition floor]($DL/03-exhibition.png) | ![Voxxy]($DL/04-voxxy.png) |"
            echo "| ![Grand staircase]($DL/05-staircase.png) | ![Cinema corridor]($DL/06-corridor.png) |"
            echo
            echo "| ![Auditorium 8]($DL/07-auditorium.png) | ![Grand finale]($DL/08-finale.png) |"
            echo
            echo "![Keynote ready]($DL/09-keynote.png)"
            echo
            echo "## What's changed"
            echo
            git log --no-merges --pretty=format:'- %s' "$RANGE" | grep -v '^- chore(release):' || echo "- Initial release"
            echo
            echo
            if [ -n "$PREV" ]; then
              echo "**Full changelog:** https://github.com/$REPO/compare/$PREV...$TAG"
            fi
          } > notes.md

          echo "--- notes.md ---"; cat notes.md

      - name: Create the release and upload every asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find artifacts -type f \( -name '*.zip' -o -name '*.png' \) | sort)
          printf 'attaching:\n'; printf '  %s\n' "${FILES[@]}"
          gh release create "$TAG" \
            --title "Please Do Not Throw Richie $TAG" \
            --notes-file notes.md \
            --latest \
            "${FILES[@]}"

  # ----------------------------------------------------------------- pages
  deploy:
    name: Redeploy Pages at the tag
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f "ref=$TAG"
